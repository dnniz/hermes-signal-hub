[project]
name = "signalhub"
version = "1.0.0"
description = "Discover high-momentum GitHub repositories and route them into Hermes flows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dennis-sama", email = "dannuzp@gmail.com" }]
keywords = ["github", "discovery", "momentum", "hermes", "automation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies on purpose. See docs/adr/0002-stdlib-only.md
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
signalhub = "signalhub.cli:main"

[project.urls]
Homepage = "https://github.com/dnniz/hermes-signal-hub"
Repository = "https://github.com/dnniz/hermes-signal-hub"
Issues = "https://github.com/dnniz/hermes-signal-hub/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "live: test requires network access to the GitHub API",
    "slow: test is comparatively expensive",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PERF", "A", "BLE", "S"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "S101",   # asserts are the point in tests
    "RUF001", # ambiguous unicode is intentional (⭐, ─, …)
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE", "N802", "PLR2004"]
"examples/*" = ["S", "T201"]
# The public exception names are part of the documented API that callers catch
# (``except BudgetExceeded``). Renaming them to BudgetExceededError would be a
# gratuitous breaking change for no safety gain.
# S310 is also disabled here, and that one is enforced rather than assumed:
# ``_call`` refuses any absolute URL outside the GitHub API base, so the
# scheme/host reaching urlopen cannot be attacker-controlled.
"src/signalhub/github.py" = ["N818", "S310"]
# ``format`` and ``license`` mirror the vocabulary of the GitHub API and the
# repo fixture respectively; shadowing the builtins here is clearer than
# inventing a second name for the same concept.
"src/signalhub/server.py" = ["A002"]
"tests/conftest.py" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["signalhub"]
